services:
  nginx:
    image: nginx:1.16
    container_name: nginx
    environment:
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./conf/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./log/nginx:/var/log/nginx
    ports:
      - "80:80"

  gitea:
    image: gitea/gitea:1.27.3
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=mysql:3306
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__security__ALLOWED_HOST_LIST=external,pr-agent
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./data/gitea:/data
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4.11
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=gitea
      - MYSQL_USER=gitea
      - MYSQL_PASSWORD=gitea
      - MYSQL_DATABASE=gitea
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./log/mysql:/var/log/mysql

  pr-agent:
    image: pragent/pr-agent:0.49.0-gitea_app
    container_name: pr-agent
    environment:
      - PORT=3000
      - GUNICORN_WORKERS=2
      - TZ=Asia/Shanghai
    env_file:
      - ./conf/pr-agent/.env
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
